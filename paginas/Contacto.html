<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | NutriFit Pro</title>

    <!-- Favicon -->
    <link rel="icon" href="../Imagenes/favicon.ico">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../estilos/estilos-bootstrap.css">
</head>

<body class="d-flex flex-column min-vh-100 fondo-principal texto-principal">

    <!-- HEADER cargado por JavaScript -->
    <div id="header"></div>

    <!-- NAV cargado por JavaScript -->
    <div id="nav"></div>

    <!-- MAIN -->
    <main class="flex-grow-1">
        <div class="container py-4">
            <section class="row justify-content-center">
                <div class="col-12 col-lg-8 col-xl-6">

                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4 p-md-5">

                            <h2 class="fuente-encabezado mb-3">Contacto</h2>

                            <p class="texto-secundario mb-4">
                                Si tienes cualquier duda, sugerencia o consulta sobre NutriFit Pro puedes contactar con
                                nosotros a través del siguiente formulario.
                            </p>

                            <form action="#" method="post">
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" id="nombre" name="nombre" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Correo electrónico</label>
                                    <input type="email" id="email" name="email" class="form-control" required>
                                </div>

                                <div class="mb-4">
                                    <label for="mensaje" class="form-label">Mensaje</label>
                                    <textarea id="mensaje" name="mensaje" rows="5" class="form-control"
                                        required></textarea>
                                </div>

                                <button type="submit" class="btn btn-naranja px-4">
                                    Enviar mensaje
                                </button>
                            </form>
                        </div>
                    </div>

                </div>
            </section>
        </div>
    </main>

    <!-- FOOTER cargado por JavaScript -->
    <div id="footer"></div>

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS propio -->
    <script src="../js/config.js"></script>
    <script src="../js/layout.js"></script>
</body>

</html>
