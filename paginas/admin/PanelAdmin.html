<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel admin | NutriFit Pro</title>

    <!-- Favicon -->
    <link rel="icon" href="../../Imagenes/favicon.ico">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../../estilos/estilos-bootstrap.css">
</head>

<body class="d-flex flex-column min-vh-100 fondo-principal texto-principal">

    <!-- HEADER cargado por JavaScript -->
    <div id="header"></div>

    <!-- NAV cargado por JavaScript -->
    <div id="nav"></div>

    <!-- MAIN -->
    <main class="flex-grow-1">
        <div class="container py-4">

            <section class="mb-5">
                <h2 class="fuente-encabezado mb-3">Panel de administración</h2>
                <p class="texto-secundario mb-0">
                    Zona privada para gestionar el contenido de NutriFit Pro.
                </p>
            </section>

            <section id="zona-admin">
                <!-- JavaScript comprobará la sesión y cargará el contenido -->
            </section>

        </div>
    </main>

    <!-- FOOTER cargado por JavaScript -->
    <div id="footer"></div>

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS propio -->
    <script src="../../js/config.js"></script>
    <script src="../../js/utilidades.js"></script>
    <script src="../../js/layout.js"></script>

    <!-- JS del panel admin -->
    <script src="../../js/admin-panel.js"></script>
    <script src="../../js/admin-recetas.js"></script>
    <script src="../../js/admin-receta-ingredientes.js"></script>
</body>

</html>
