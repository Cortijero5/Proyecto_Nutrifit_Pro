<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Calculadora AJAX</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos/estilos-bootstrap.css">
</head>

<body class="fondo-principal texto-principal">

    <main class="container py-5">
        <h1 class="fuente-encabezado mb-4">Calculadora de calorías</h1>

        <p class="texto-secundario mb-4">
            Selecciona ingredientes, introduce la cantidad en gramos y calcula el total nutricional.
        </p>

        <div id="mensaje-calculadora" class="mb-3"></div>

        <section class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-4">

                <form id="form-calculadora" class="row g-3">

                    <div class="col-12 col-md-6">
                        <label for="ingrediente" class="form-label">Ingrediente</label>
                        <select id="ingrediente" class="form-select" required>
                            <option value="">Cargando ingredientes...</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="cantidad" class="form-label">Cantidad en gramos</label>
                        <input type="number" id="cantidad" class="form-control" min="1" step="1" placeholder="Ej: 200"
                            required>
                    </div>

                    <div class="col-12 col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-naranja w-100">
                            Añadir
                        </button>
                    </div>

                </form>

            </div>
        </section>

        <section class="row g-4">
            <div class="col-12 col-lg-7">
                <h2 class="h4 fuente-encabezado mb-3">Ingredientes añadidos</h2>

                <div id="lista-ingredientes">
                    <div class="alert alert-info">
                        Todavía no has añadido ingredientes.
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-5">
                <div id="totales-calculadora">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4">
                            <h2 class="h4 fuente-encabezado mb-3">Totales</h2>

                            <p><strong>Calorías:</strong> 0 kcal</p>
                            <p><strong>Proteínas:</strong> 0 g</p>
                            <p><strong>Hidratos:</strong> 0 g</p>
                            <p class="mb-0"><strong>Grasas:</strong> 0 g</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/calculadora.js"></script>
</body>

</html>
