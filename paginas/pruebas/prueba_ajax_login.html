<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Prueba Login AJAX</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos/estilos-bootstrap.css">
</head>

<body class="fondo-principal texto-principal">

    <main class="container py-5">
        <h1 class="fuente-encabezado mb-4">Login con AJAX</h1>

        <div class="row justify-content-center">
            <div class="col-12 col-md-6">

                <div id="mensaje-login" class="mb-3"></div>

                <form id="form-login" class="card border-0 shadow-sm rounded-4 p-4">

                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" id="email" name="email" class="form-control" value="fran.free@nutrifit.es"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" value="1234" required>
                    </div>

                    <button type="submit" class="btn btn-naranja w-100">
                        Iniciar sesión
                    </button>

                </form>

            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
