<body class="d-flex flex-column min-vh-100 fondo-principal texto-principal">

            <audio controls class="w-100">

              Tu navegador no soporta audio HTML5.
            </audio>
          </div>
        </div>
      </section>

      <section>
        <div class="card border-0 shadow-sm rounded-4">
